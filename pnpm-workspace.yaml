packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - argon2
  - prisma
  - sharp

# pnpm v11 removed onlyBuiltDependencies in favor of allowBuilds — kept both
# since unrecognized keys are silently ignored, so this works on pnpm 10 and 11.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  prisma: true
  sharp: true
