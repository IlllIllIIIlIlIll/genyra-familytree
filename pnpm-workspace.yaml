packages:
  - 'apps/*'
  - 'packages/*'

# @nestjs/platform-fastify pins its own fastify version, which pnpm's strict
# isolation resolves as a second, separate copy from apps/api's own direct
# `fastify` dependency — same version range, but two nominally distinct
# FastifyInstance types, breaking TS assignability for anything that imports
# `fastify` directly (e.g. app.register() for a plugin). Force one copy.
overrides:
  fastify: ^5.8.2

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - argon2
  - prisma
  - sharp

# pnpm v11 removed onlyBuiltDependencies in favor of allowBuilds — kept both
# since unrecognized keys are silently ignored, so this works on pnpm 10 and 11.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  prisma: true
  sharp: true
